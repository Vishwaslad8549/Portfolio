<section class="hero">
  <div class="hero-content">
    <!-- Status/Eyebrow -->
    <div class="hero-status" [@fadeInUp]="animationState">
      <div class="status-indicator"></div>
      <span>Available for new opportunities</span>
    </div>

    <!-- Main heading with gradient -->
    <h1 class="hero-heading" [@fadeInUp]="animationState">
      Hi, I'm <span class="gradient-text">Vishwas Lad</span><br>
      <span class="role-text">Angular Developer</span>
    </h1>
    
    <!-- Description -->
    <p class="hero-description" [@fadeInUp]="animationState">
      I craft modern, scalable web applications with a focus on exceptional user experiences. 
      Specializing in Angular, TypeScript, and cutting-edge frontend technologies.
    </p>

    <!-- CTA Buttons -->
    <div class="hero-cta" [@fadeInUp]="animationState">
      <a (click)="contactClick()" class="cta-primary">
        <span>Let's Work Together</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      
      <div class="social-links">
        <a href="https://github.com/Vishwaslad8549" target="_blank" rel="noopener noreferrer" 
           class="social-link" aria-label="GitHub Profile">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://www.linkedin.com/in/vishwas-lad-a53949156" target="_blank" rel="noopener noreferrer" 
           class="social-link" aria-label="LinkedIn Profile">
          <i class="fab fa-linkedin"></i>
        </a>
      </div>
    </div>
  </div>

  <!-- Decorative elements -->
  <div class="hero-decoration">
    <div class="decoration-orb decoration-orb-1"></div>
    <div class="decoration-orb decoration-orb-2"></div>
    <div class="decoration-grid"></div>
  </div>
</section>
